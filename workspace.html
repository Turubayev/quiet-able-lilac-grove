<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ответик · рабочее место</title><style>
*{box-sizing:border-box}body{font:17px/1.6 system-ui;background:#f7f5ef;color:#182c25;max-width:1050px;margin:40px auto;padding:20px}h1{font-size:42px;margin-bottom:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:white;padding:24px;border:1px solid #c4cfc7;border-radius:12px}textarea,select,button{font:inherit;width:100%;padding:12px;border:1px solid #778c80;border-radius:6px;margin:8px 0 16px}button{background:#174c3c;color:white;cursor:pointer}button:disabled{opacity:.5}textarea{min-height:160px}label{display:block}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:30px}li{margin:8px 0}.muted{color:#4e6259}a{color:#174c3c}:focus-visible{outline:3px solid #a44716;outline-offset:3px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><h1>Ответик</h1><p class="muted">Рабочее место сотрудника · черновики по правилам магазина</p><div class="grid"><form id="form" class="card"><label for="question">Обезличенный вопрос покупателя</label><textarea id="question" maxlength="4000" required placeholder="Сколько стоит доставка по Алматы?"></textarea><label for="language">Язык</label><select id="language"><option value="ru">Русский</option><option value="kk">Қазақша</option></select><label for="mode">Подготовка ответа</label><select id="mode"><option value="local">Точные выдержки из правил · локально</option><option value="claude">Черновик Claude · внешняя обработка</option></select><label><input type="checkbox" id="consent"> Разрешаю передать обезличенный вопрос и выбранные правила в Anthropic</label><button id="generate" type="submit">Подготовить черновик</button><p id="status" role="status" aria-live="polite"></p></form><section class="card"><h2>Черновик</h2><textarea id="draft" aria-label="Редактируемый черновик"></textarea><h3>Использованные правила</h3><ul id="sources"></ul><label><input type="checkbox" id="review"> Я сверил текст с правилами магазина</label><button id="copy" disabled>Скопировать проверенный ответ</button><p class="muted">Приложение не отправляет сообщения покупателям. Правила загружаются из shop.json.</p></section></div><script src="workspace.js"></script></body></html>
